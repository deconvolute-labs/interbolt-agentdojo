# workspace/demo.yaml -- the research artifact for the workspace suite.
#
# METHODOLOGY (same discipline as policies/banking/targeted.yaml and
# policies/travel/targeted.yaml): every trust call below is justified by
# reading agentdojo's tool implementations --
# default_suites/v1/tools/{email_client,cloud_drive_client,calendar_client}.py
# -- not by which of this suite's injection tasks succeed against a draft.
#
# WHY THESE RULES USE `run.tainted` AND NOT `taint.exists(...)` ON `args`.
# InterboltToolsExecutor._dispatch (interbolt_agentdojo/executor.py) calls
# interbolt's check() with `dict(tool_call.args)` -- the model's freshly
# parsed JSON tool-call arguments. That's never the same Tainted-wrapped
# object a prior call's output was wrapped in: the tainted output re-enters
# the model as a plain string in chat history, and the next call's args are
# the model's own regeneration from that text. So argument-level taint never
# survives a hop in this harness, and `taint.exists(...)`/`max_trust` over
# `args` are always the vacuous case -- a rule written that way would be
# dead code that never fires. `run.tainted` is the signal that actually
# reflects "this run has ingested untrusted content," and it's what every
# rule below uses. Same reason banking/travel's targeted.yaml never
# reference `taint.exists(...)` on `args` either.
#
# TRUST CLASSIFICATION:
#   tool:search_files_by_filename, tool:search_files,
#   tool:get_file_by_id, tool:list_files                -> untrusted
#     Return CloudDriveFile.content/.filename verbatim: free-form text
#     writable by any prior create_file/append_to_file call, including an
#     injected one (cloud_drive_client.py).
#   tool:search_emails, tool:get_unread_emails, tool:get_received_emails,
#   tool:get_sent_emails, tool:get_draft_emails          -> untrusted
#     Return Email.subject/.body verbatim -- the injection vector for this
#     suite lives here (email_client.py).
#   tool:get_day_calendar_events, tool:search_calendar_events -> untrusted
#     Return CalendarEvent.title/.description, which create_calendar_event
#     lets any prior call (including an untrusted one, within the same run)
#     set to arbitrary text (calendar_client.py). Same precedent as
#     policies/travel/targeted.yaml's calendar read-back tools.
#   tool:search_contacts_by_name                         -> trusted
#     EmailContact.name is derived by splitting a validated EmailStr, never
#     free text -- no attacker-writable path (email_client.py).
#   tool:get_current_day                                 -> trusted
#     Scalar environment clock value, not attacker-writable.
#
#   The entries above are all reads. The mutating tools return values too, and
#   InterboltToolsExecutor._dispatch taints the formatted result of *every*
#   allowed call, so each mutating tool needs a trust call of its own. Leaving
#   one out is not neutral: interbolt's resolve_source_trust defaults an
#   undeclared name to untrusted and that fallback is fixed, so an omission
#   silently taints the run. Read against their return expressions, they split
#   two ways.
#
#   RECEIPT RETURNS -- the caller's own arguments echoed back alongside
#   environment-generated scalars. No external content enters the run through
#   them, so they are not ingress:
#   tool:send_email                                      -> trusted
#     Returns the Email it just built from recipients/subject/body; id_,
#     timestamp, sender and status are environment-generated (email_client.py).
#   tool:create_file                                     -> trusted
#     Returns the CloudDriveFile it just built from filename/content; id_,
#     owner, size and last_modified are environment-generated
#     (cloud_drive_client.py).
#   tool:create_calendar_event                           -> trusted
#     Returns the CalendarEvent it just built from the call's own arguments.
#     It also mails an invite as a side effect, but the return is a receipt
#     (calendar_client.py).
#   tool:delete_email, tool:cancel_calendar_event        -> trusted
#     Return a fixed-format string embedding only the caller's own email_id /
#     event_id, nothing read from the environment.
#   tool:search_contacts_by_email                        -> trusted
#     Same reasoning as search_contacts_by_name above: EmailContact.name is
#     derived by splitting a validated EmailStr, never free text.
#
#   READ-BACK RETURNS -- mutating tools that hand the stored object back,
#   free-form text written by some earlier call included. These are ingress in
#   exactly the way the read tools are:
#   tool:delete_file, tool:append_to_file, tool:share_file -> untrusted
#     All three return the whole CloudDriveFile with .content -- the
#     pre-existing content, not merely what this call supplied
#     (cloud_drive_client.py).
#   tool:reschedule_calendar_event,
#   tool:add_calendar_event_participants                 -> untrusted
#     Return the stored CalendarEvent with .title/.description
#     (calendar_client.py).
#
#   Declaring the receipts trusted cannot launder an earlier untrusted read:
#   run ingress accumulates and is never pruned, and run_tainted is "any entry
#   untrusted" over it, so run.tainted only ever goes false -> true within a
#   run. Every rule below gates on run.tainted alone, never on label-level
#   max_trust.
#
#   user_prompt                                           -> trusted
#     Declared for documentation, matching the standing convention in
#     interbolt's packaged policy.example.yaml (`user_input`); this harness
#     never literally calls taint(source="user_prompt").
#
# DELIBERATELY UNCOVERED TOOLS (no `sinks:` entry -- fall through to
# `defaults.sink_action`, and never appear in policy_coverage.py's declared
# table):
#   share_file            -- capability-symmetry gap: send_email gets three
#                             rules and a group gate; share_file, which can
#                             equally hand drive content to an outside party,
#                             gets none.
#   delete_email           -- the cover-your-tracks step both
#                             injection_task_5 and injection_task_11 use to
#                             erase the email they just sent. Leaving it
#                             unanalyzed is a real gap, not a masked one --
#                             a softer version of the same asymmetry above.
#   search_contacts_by_email -- low-traffic read, left out so the coverage
#                             numbers reflect an honest first pass rather
#                             than every tool being touched once for form.

version: "2.0"

defaults:
  sink_action: block

sources:
  - name: "tool:search_files_by_filename"
    trust: untrusted
  - name: "tool:search_files"
    trust: untrusted
  - name: "tool:get_file_by_id"
    trust: untrusted
  - name: "tool:list_files"
    trust: untrusted
  - name: "tool:search_emails"
    trust: untrusted
  - name: "tool:get_unread_emails"
    trust: untrusted
  - name: "tool:get_received_emails"
    trust: untrusted
  - name: "tool:get_sent_emails"
    trust: untrusted
  - name: "tool:get_draft_emails"
    trust: untrusted
  - name: "tool:get_day_calendar_events"
    trust: untrusted
  - name: "tool:search_calendar_events"
    trust: untrusted
  - name: "tool:search_contacts_by_name"
    trust: trusted
  - name: "tool:get_current_day"
    trust: trusted
  # Receipt returns: the call's own arguments plus environment-generated
  # scalars. Not an ingress channel -- see TRUST CLASSIFICATION above.
  - name: "tool:send_email"
    trust: trusted
  - name: "tool:create_file"
    trust: trusted
  - name: "tool:create_calendar_event"
    trust: trusted
  - name: "tool:delete_email"
    trust: trusted
  - name: "tool:cancel_calendar_event"
    trust: trusted
  - name: "tool:search_contacts_by_email"
    trust: trusted
  # Read-back returns: mutating tools that hand back the stored object with
  # its free-form text. Ingress, same as the read tools.
  - name: "tool:delete_file"
    trust: untrusted
  - name: "tool:append_to_file"
    trust: untrusted
  - name: "tool:share_file"
    trust: untrusted
  - name: "tool:reschedule_calendar_event"
    trust: untrusted
  - name: "tool:add_calendar_event_participants"
    trust: untrusted
  - name: "user_prompt"
    trust: trusted

# Four demo identities (--agent-id in interbolt_agentdojo/run_benchmark.py),
# with deliberately uneven privilege: ops-assistant and inbox-triage are in
# internal-ops, so they clear the send_email/create_file/delete_file/
# append_to_file group gates below; calendar-bot (scheduling only) and
# drive-indexer (no group) clear none of those gates. Per-sink rules below
# add further, identity-specific restrictions on top of the group gate --
# see each sink's `rules:` for exactly which ids they name. An agent id
# absent from this table (including the CLI's own default) resolves to no
# groups, same as drive-indexer.
agents:
  ops-assistant:
    groups: [internal-ops]
  inbox-triage:
    groups: [internal-ops]
  calendar-bot:
    groups: [scheduling]
  drive-indexer: {}

sinks:
  # --- Email ---------------------------------------------------------
  email.send_email:
    capabilities: [reaches_external]
    rules:
      - name: block_non_internal_ops
        when: "!agent.groups.exists(g, g == 'internal-ops')"
        action: block
      - name: block_untrusted_exfil
        when: "run.tainted && args.recipients.exists(r, !r.endsWith('@bluesparrowtech.com'))"
        action: block
      - name: require_approval_external
        when: "args.recipients.exists(r, !r.endsWith('@bluesparrowtech.com'))"
        action: require_approval
      - name: default
        action: allow

  email.get_unread_emails:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  email.get_sent_emails:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  email.get_received_emails:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  email.get_draft_emails:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  email.search_emails:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  email.search_contacts_by_name:
    capabilities: []
    rules:
      - name: default
        action: allow

  # delete_email, search_contacts_by_email: no entry -- see header.

  # --- Calendar --------------------------------------------------------
  calendar.get_current_day:
    capabilities: []
    rules:
      - name: default
        action: allow

  calendar.search_calendar_events:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  calendar.get_day_calendar_events:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  calendar.create_calendar_event:
    capabilities: [reaches_external]
    rules:
      - name: require_approval_untrusted
        when: run.tainted
        action: require_approval
      - name: default
        action: allow

  calendar.reschedule_calendar_event:
    capabilities: [reaches_external]
    rules:
      - name: require_approval_untrusted
        when: run.tainted
        action: require_approval
      - name: default
        action: allow

  calendar.cancel_calendar_event:
    capabilities: []
    rules:
      - name: default
        action: allow

  calendar.add_calendar_event_participants:
    capabilities: []
    rules:
      - name: default
        action: allow

  # --- Cloud drive -------------------------------------------------------
  drive.search_files_by_filename:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  drive.search_files:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  drive.get_file_by_id:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  drive.list_files:
    capabilities: [reads_private]
    rules:
      - name: default
        action: allow

  drive.create_file:
    capabilities: []
    rules:
      - name: block_non_internal_ops
        when: "!agent.groups.exists(g, g == 'internal-ops')"
        action: block
      - name: default
        action: allow

  drive.delete_file:
    capabilities: []
    rules:
      - name: block_non_internal_ops
        when: "!agent.groups.exists(g, g == 'internal-ops')"
        action: block
      - name: block_calendar_bot_delete
        when: agent.id == "calendar-bot"
        action: block
      - name: block_when_run_tainted
        when: run.tainted
        action: block
      - name: default
        action: allow

  drive.append_to_file:
    capabilities: []
    rules:
      - name: block_non_internal_ops
        when: "!agent.groups.exists(g, g == 'internal-ops')"
        action: block
      - name: block_when_run_tainted
        when: run.tainted
        action: block
      - name: default
        action: allow

  # share_file: no entry -- see header.
