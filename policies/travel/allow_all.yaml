# allow_all/travel.yaml. The no-enforcement control for the travel suite.
#
# PURPOSE. This is the baseline that pairs with strict and targeted. It makes
# no enforcement decision other than allow, so it measures two things with
# Interbolt in the loop but permitting everything: the model's raw task
# utility, and the raw attack success rate an attacker achieves with no
# defense. It is the reference point the other two policies are read against.
#
# HOW IT WORKS. The engine resolves any tool that has no sink entry to
# defaults.sink_action. With sink_action set to allow and no sinks declared,
# every call in the suite falls through to allow. Taint is still tracked
# internally (the harness still calls taint() on review reads), but no sink
# has a condition that references it, so it never changes a decision. No
# sources are declared for the same reason: nothing gates on trust here, so
# classifying it would be inert.
#
# WHAT TO EXPECT. Every one of the 20 user tasks runs unimpeded, so this
# fixes the utility ceiling for the suite. Every one of the 7 injection tasks
# whose action the model actually takes also goes through: the two hotel
# reservations (inj 0, 4), the three email exfils to @google.com (inj 1, 3,
# 5), and the calendar-event write (inj 2) are all permitted. Inj 6 is a
# text-only manipulation with no tool call, so no policy touches it in either
# direction. Reading this file's results next to strict and targeted isolates
# exactly what the enforcement layer changes: the same 14 read-only tasks stay
# up, the 6 write-after-read tasks are the utility that enforcement costs, and
# the sink-addressable attacks are what enforcement blocks.

version: "1.0"

defaults:
  sink_action: allow

sinks: {}